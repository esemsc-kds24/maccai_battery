# =============================================================================
# MACCAI Battery Materials Discovery Pipeline — Configuration
# =============================================================================

project:
  name: "MACCAI-Battery"
  output_dir: "output"
  dirs:
    candidates: "candidates"
    ml_relaxed: "candidates/ml_relaxed"
    cifs: "candidates/cifs"
    vasp_inputs: "vasp_inputs"
    dft_scf: "dft/scf"
    dft_relax: "dft/relax"
    logs: "logs"
  candidates_db: "candidates.ndjson"

# -----------------------------------------------------------------------------
# GENERATION  (MatterGen)
# -----------------------------------------------------------------------------
generation:
  chemical_system: "Li-Fe-P-O"
  energy_above_hull: 0.05
  model_name: "chemical_system_energy_above_hull"
  batch_size: 8
  num_batches: 8
  diffusion_guidance_factor: 2.0
  pytorch_mps_fallback: false

# -----------------------------------------------------------------------------
# ML RELAXATION  (MatterSim via ASE)
# -----------------------------------------------------------------------------
relaxation:
  device: "cpu"
  max_structures: null
  fmax: 0.05
  max_steps: 300
  relax_cell: true
  emt_fallback: false    # FIX: was true — EMT silently corrupts all DFT steps

# -----------------------------------------------------------------------------
# STRUCTURAL SANITY CHECKS  (pymatgen)
# -----------------------------------------------------------------------------
screening:
  min_distance_threshold_A: 1.0
  density_min_gcc: 1.0
  density_max_gcc: 8.0
  assign_oxidation_states: true
  check_charge_neutrality: true
  check_bond_valence: true
  hard_filter: false

# -----------------------------------------------------------------------------
# STRUCTURE DEDUPLICATION
# -----------------------------------------------------------------------------
deduplication:
  enabled: true
  fingerprint_method: "pymatgen_rdf"   # FIX: was formula_volume_density (misses polymorphs)
  volume_tolerance_A3: 5.0
  density_tolerance_gcc: 0.05
  log_removed: true

# -----------------------------------------------------------------------------
# DFT SCREENING — QE SCF
# -----------------------------------------------------------------------------
dft_screening:
  n_candidates: 8
  nproc: 1
  kpoints: [2, 2, 2]

  # FIX: was 35 Ry — too low for kjpaw PAW pseudopotentials
  ecutwfc: 45
  ecutrho: 360   # 8× ecutwfc

  functional: "PBE"

  # FIX: was "mp" / 0.03 — Methfessel-Paxton adds fictitious entropy in insulators
  smearing: "mv"    # Marzari-Vanderbilt cold smearing — correct for LiFePO4
  degauss: 0.01     # Narrow width (Ry) for insulating system

  conv_thr: 1.0e-4

  # FIX: was 0.3 — lower beta + local-TF mixing prevents charge sloshing in Fe systems
  mixing_beta: 0.1
  mixing_mode: "local-TF"   # Thomas-Fermi screening — much better for magnetic oxides
  nmix: 12                   # increased mixing history (default 8 too short)

  spin_polarised: true
  starting_magnetization:
    Li: 0.0
    Fe: 0.3
    P: 0.0
    O: 0.0

  # FIX: DFT+U for Fe 3d — ADDED (was missing entirely)
  # Without U, PBE gives ~0.1 eV gap for LiFePO4 vs experimental 3.6-4.0 eV.
  # Materials Project uses U=5.3 eV for Fe (Dudarev scheme).
  hubbard_u:
    enabled: true
    lda_plus_u_kind: 0    # 0 = Dudarev (rotationally invariant, U_eff = U-J)
    U:
      Fe: 5.3             # eV — matches Materials Project value

# -----------------------------------------------------------------------------
# DFT RELAXATION — QE IONIC RELAX
# -----------------------------------------------------------------------------
dft_relax:
  n_candidates: 3
  nproc: 1
  kpoints: [3, 3, 3]
  ecutwfc: 45
  ecutrho: 360
  ion_dynamics: "bfgs"

  # FIX: was 10 — far too few for BFGS to converge (needs 20-40+ steps)
  nstep: 100

  conv_thr: 1.0e-5

  # FIX: smearing and degauss ADDED (were missing from dft_relax entirely)
  # input_generator.py reads relax.smearing and relax.degauss — these MUST exist
  smearing: "mv"
  degauss: 0.01

  # FIX: same mixing improvements as dft_screening
  mixing_beta: 0.1
  mixing_mode: "local-TF"
  nmix: 12

  spin_polarised: true
  starting_magnetization:
    Li: 0.0
    Fe: 0.4
    P: 0.0
    O: 0.0

  # FIX: DFT+U for Fe 3d — ADDED (was missing entirely)
  hubbard_u:
    enabled: true
    lda_plus_u_kind: 0
    U:
      Fe: 5.3             # eV

# -----------------------------------------------------------------------------
# PSEUDOPOTENTIALS
# -----------------------------------------------------------------------------
pseudopotentials:
  pseudo_dir: "pseudo"
  files:
    Li: "Li.pbe-s-kjpaw_psl.1.0.0.UPF"
    Fe: "Fe.pbe-spn-kjpaw_psl.0.2.1.UPF"
    P:  "P.pbe-n-kjpaw_psl.0.1.UPF"
    O:  "O.pbe-n-kjpaw_psl.0.1.UPF"

# -----------------------------------------------------------------------------
# HULL ANALYSIS
# -----------------------------------------------------------------------------
hull:
  stability_threshold_eV: 0.1
  mp_api_key: ""
  energy_source: "relax"
  report_max_e_above_hull: 0.5

# -----------------------------------------------------------------------------
# CANDIDATE DATABASE
# -----------------------------------------------------------------------------
database:
  generator: "MatterGen"
  dft_workflow: "PBE_scf_relax_QE"
  vasp_incar_defaults:
    ENCUT: 520
    KSPACING: 0.3